ipv6: true
mode: rule
mixed-port: 7890
allow-lan: true
log-level: warning
tun:
  enable: false
  stack: gvisor
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  dns-hijack:
    - any:53
  route-exclude-address: []
  mtu: 1500
  device: Mihomo
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*"
    - +.lan
    - +.local
    - time.*.com
    - ntp.*.com
    - +.market.xiaomi.com
    - api.memeniu.xyz
    - meme.us.kg
    - +.steamserver.net
  use-hosts: false
  use-system-hosts: false
  respect-rules: true
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 127.0.0.0/8
      - 10.0.0.0/8
      - 192.168.0.0/16
    domain:
      - +.google.com
      - +.facebook.com
      - +.youtube.com
  direct-nameserver-follow-policy: true
  prefer-h3: false
  nameserver-policy:
    geosite:cn:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    geosite:geolocation-!cn:
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
    +.jsdelivr.net:
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
    +.github.com:
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
    +.githubusercontent.com:
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
    +.githubassets.com:
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
    +.fastly.net:
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
    api.memeniu.xyz:
      - https://[2402:4e00::]/dns-query
      - https://[2400:3200::1]/dns-query
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    meme.us.kg:
      - https://[2402:4e00::]/dns-query
      - https://[2400:3200::1]/dns-query
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    +.steamserver.net:
      - https://[2402:4e00::]/dns-query
      - https://[2400:3200::1]/dns-query
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
profile:
  store-selected: true
  store-fake-ip: true
proxies: []
proxy-providers: {}
proxy-groups: []
rule-providers: {}
rules: []
