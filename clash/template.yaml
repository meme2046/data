ipv6: true
mode: rule
mixed-port: 7890
allow-lan: true
log-level: warning
tun:
  enable: true
  stack: mips
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  dns-hijack:
    - any:53
  route-exclude-address: []
  mtu: 1500
  device: Mihomo
  strict-route: false
  exclude-process:
    - GCUService.exe
    - GCUBridge.exe
    - GSCService.exe
    - gsupservice.exe
    - gchsvc.exe
